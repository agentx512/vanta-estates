<VirtualHost *:80>
    ServerName realestatedemo.local
    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:3100/
    ProxyPassReverse / http://127.0.0.1:3100/
    ErrorLog ${APACHE_LOG_DIR}/realestatedemo-error.log
    CustomLog ${APACHE_LOG_DIR}/realestatedemo-access.log combined
</VirtualHost>
